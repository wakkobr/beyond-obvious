<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Gradiente de fundo escuro -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E232E" />
      <stop offset="70%" stop-color="#101216" />
      <stop offset="100%" stop-color="#060709" />
    </radialGradient>
  </defs>

  <!-- Fundo Circular -->
  <circle cx="32" cy="32" r="31" fill="url(#bgGrad)" stroke="rgba(224, 225, 221, 0.2)" stroke-width="1" />

  <!-- Arcos HUD Ciano -->
  <path d="M 32 3 A 29 29 0 0 1 61 32" fill="none" stroke="#4CC9F0" stroke-width="2" stroke-linecap="round" />
  <path d="M 32 61 A 29 29 0 0 1 3 32" fill="none" stroke="#4CC9F0" stroke-width="2" stroke-linecap="round" />

  <!-- Geometria Tecnomágica: Losango Ciano & Quadrado Carmesim -->
  <rect x="15" y="15" width="34" height="34" fill="none" stroke="#4CC9F0" stroke-width="1.2" transform="rotate(45 32 32)" opacity="0.6" />
  <rect x="19" y="19" width="26" height="26" fill="none" stroke="#E63946" stroke-width="1.8" transform="rotate(45 32 32)" />

  <!-- Monograma BO Centralizado -->
  <text x="32" y="38" 
        text-anchor="middle" 
        font-family="'Orbitron', 'Rajdhani', -apple-system, sans-serif" 
        font-size="17" 
        font-weight="900" 
        letter-spacing="0.5" 
        fill="#E0E1DD">BO</text>

  <!-- Marcadores de Pulso Carmesim -->
  <circle cx="32" cy="7" r="1.5" fill="#E63946" />
  <circle cx="32" cy="57" r="1.5" fill="#E63946" />
</svg>
