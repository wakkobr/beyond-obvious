backend:
  name: github
  repo: SEU_USUARIO/SEU_REPOSITORIO # substitua pelo seu repo se necessário
  branch: main

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "terminal"
    label: "Terminal de Mídia"
    folder: "src/content/terminal"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Resumo", name: "summary", widget: "string" }
      - { 
          label: "Categoria", 
          name: "category", 
          widget: "select", 
          options: ["avian", "rpg", "gaming", "narrativas", "nexus"],
          default: "avian"
        }
      - { label: "Data de Publicação", name: "publishDate", widget: "datetime" }
      - { 
          label: "Avaliação (Estrelas)", 
          name: "rating", 
          widget: "select", 
          options: ["1", "2", "3", "4", "5"],
          default: "5",
          required: false 
        }
      - { label: "Link Externo (Opcional)", name: "externalLink", widget: "string", required: false }
      - { label: "Corpo do Texto", name: "body", widget: "markdown" }